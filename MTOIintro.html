<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTOI · 地址迁移通知</title>
<style>
  :root{
    --bg:#060B14;
    --bg-card:rgba(11,20,38,.85);
    --text:#ffffff;
    --text-dim:#8B9EB8;
    --text-mid:#CBD5E1;
    --border:rgba(95,159,214,.12);
    --border-strong:rgba(95,159,214,.25);
    --blue:#5F9FD6;
    --pink:#ED5F82;
    --purple:#8B7FE8;
    --gold:#FBBF24;
    --neon:#7DD3FC;
    --grid-blue:rgba(95,159,214,.025);
    --grid-pink:rgba(237,95,130,.06);
    --scan:rgba(0,0,0,.18);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  body{
    min-height:100vh;
    background-color:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 赛博网格 + 光晕背景 */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 45% 35% at 20% 20%, rgba(95,159,214,.18), transparent 60%),
      radial-gradient(ellipse 45% 35% at 80% 80%, rgba(237,95,130,.15), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(139,127,232,.08), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% -10%, rgba(95,159,214,.08), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 110%, var(--grid-pink), transparent 70%),
      linear-gradient(var(--grid-blue) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-blue) 1px, transparent 1px);
    background-size:auto,auto,auto,auto,auto,48px 48px,48px 48px;
    animation: bgGlow 8s ease-in-out infinite alternate;
  }
  @keyframes bgGlow{
    0%{ opacity:.8; }
    100%{ opacity:1; }
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scan) 2px, var(--scan) 4px);
    opacity:.35;
  }

  /* ========== 主容器 ========== */
  .container{
    position:relative; z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:48px 32px;
    text-align:center;
    animation: fadeIn 1s ease-out;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* MTOI 六边形Logo */
  .mtoi-hex-wrap{
    position:relative;
    width:160px; height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hex-outer{
    position:absolute;
    width:100%; height:100%;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:conic-gradient(from 0deg, var(--blue), var(--purple), var(--pink), var(--blue));
    animation: hexRotate 12s linear infinite, hexPulse 4s ease-in-out infinite alternate;
    filter: blur(0px);
  }
  @keyframes hexRotate{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @keyframes hexPulse{
    0%{ 
      box-shadow: 0 0 32px rgba(95,159,214,.5), 0 0 64px rgba(237,95,130,.3), 0 0 96px rgba(139,127,232,.2);
      filter: brightness(1);
    }
    100%{ 
      box-shadow: 0 0 48px rgba(95,159,214,.7), 0 0 80px rgba(237,95,130,.45), 0 0 120px rgba(139,127,232,.3);
      filter: brightness(1.15);
    }
  }
  .hex-inner{
    position:relative;
    width:144px; height:144px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    animation: innerGlow 4s ease-in-out infinite alternate;
  }
  @keyframes innerGlow{
    0%{ background: var(--bg); }
    100%{ background: #0A1528; }
  }
  .hex-logo-text{
    font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
    font-size:46px;
    font-weight:900;
    letter-spacing:.06em;
    color: transparent;
    -webkit-text-stroke: 2px var(--blue);
    text-stroke: 2px var(--blue);
    text-shadow: 
      0 0 12px rgba(95,159,214,.6),
      0 0 24px rgba(95,159,214,.35),
      0 0 40px rgba(139,127,232,.2);
    position:relative;
    z-index:3;
    animation: hollowGlow 3s ease-in-out infinite alternate;
  }
  @keyframes hollowGlow{
    0%{ 
      -webkit-text-stroke-color: var(--blue);
      text-stroke-color: var(--blue);
      filter: brightness(1) drop-shadow(0 0 8px rgba(95,159,214,.4));
    }
    100%{ 
      -webkit-text-stroke-color: #8BC0F0;
      text-stroke-color: #8BC0F0;
      filter: brightness(1.3) drop-shadow(0 0 16px rgba(237,95,130,.3));
    }
  }

  /* 围绕六边形的传送光环 */
  .teleport-ring{
    position:absolute;
    top:50%; left:50%;
    width:220px; height:220px;
    margin:-110px 0 0 -110px;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--blue);
    border-bottom-color:var(--pink);
    animation: spin 3s linear infinite;
    pointer-events:none;
    opacity:.6;
  }
  .teleport-ring.r2{
    width:260px; height:260px;
    margin:-130px 0 0 -130px;
    border-top-color:var(--purple);
    border-bottom-color:var(--neon);
    animation: spin 4s linear infinite reverse;
    opacity:.4;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  /* 文字区域 */
  .text-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    margin-top:20px;
  }

  .msg-mid{
    font-size:20px;
    font-weight:600;
    color:var(--text-mid);
    letter-spacing:.06em;
    text-shadow:0 0 20px rgba(95,159,214,.15);
    animation: textGlow 3s ease-in-out infinite alternate;
  }
  @keyframes textGlow{
    0%{ text-shadow:0 0 20px rgba(95,159,214,.15); }
    100%{ text-shadow:0 0 30px rgba(95,159,214,.3), 0 0 40px rgba(139,127,232,.2); }
  }

  /* 迁移技能特效文字 */
  .skill-tag{
    display:inline-block;
    padding:2px 10px;
    margin-left:4px;
    border-radius:4px;
    background:linear-gradient(90deg,rgba(139,127,232,.2),rgba(95,159,214,.2));
    border:1px solid rgba(139,127,232,.4);
    color:var(--purple);
    font-weight:700;
    font-size:18px;
    text-shadow:0 0 8px rgba(139,127,232,.5);
    animation: skillFlicker 2s ease-in-out infinite;
  }
  @keyframes skillFlicker{
    0%,100%{ opacity:1; }
    50%{ opacity:.7; }
  }

  /* 大按钮 */
  .go-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:18px 48px;
    border-radius:14px;
    border:2px solid var(--blue);
    background:linear-gradient(180deg, rgba(95,159,214,.15), rgba(95,159,214,.03));
    color:var(--blue);
    font-family:inherit;
    font-size:26px;
    font-weight:800;
    letter-spacing:.08em;
    text-decoration:none;
    cursor:pointer;
    transition:all .25s ease;
    box-shadow:
      0 6px 0 rgba(95,159,214,.2),
      0 0 32px rgba(95,159,214,.2),
      inset 0 0 20px rgba(95,159,214,.05);
    text-shadow:0 0 16px rgba(95,159,214,.5);
    margin-top:8px;
    overflow:hidden;
  }
  .go-btn::before{
    content:"";
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ left:-100%; }
    50%,100%{ left:100%; }
  }
  .go-btn:hover{
    transform:translateY(-4px);
    background:linear-gradient(180deg, rgba(237,95,130,.25), rgba(237,95,130,.06));
    border-color:var(--pink);
    color:#fff;
    box-shadow:
      0 8px 0 rgba(237,95,130,.35),
      0 0 48px rgba(237,95,130,.5),
      0 0 80px rgba(139,127,232,.3),
      inset 0 0 30px rgba(237,95,130,.1);
    text-shadow:0 0 24px rgba(237,95,130,.8), 0 0 48px rgba(139,127,232,.4);
  }
  .go-btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 rgba(95,159,214,.2), 0 0 20px rgba(95,159,214,.3);
  }
  .go-btn .arrow{
    font-size:28px;
    animation: arrowBounce 1.2s ease-in-out infinite;
  }
  @keyframes arrowBounce{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(6px); }
  }

  /* 底部小字说明 */
  .note-small{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.04em;
    opacity:.7;
    margin-top:4px;
    animation: noteFade 2s ease-out 0.5s both;
  }
  .note-small b{
    color:var(--gold);
    font-weight:600;
    text-shadow:0 0 8px rgba(251,191,36,.3);
  }
  @keyframes noteFade{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:.7; transform:translateY(0); }
  }

  /* 粒子传送效果 */
  .particles{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    opacity:.6;
    animation: float linear infinite;
  }
  .particle.c1{ background:var(--blue); box-shadow:0 0 6px var(--blue); }
  .particle.c2{ background:var(--pink); box-shadow:0 0 6px var(--pink); }
  .particle.c3{ background:var(--purple); box-shadow:0 0 6px var(--purple); }
  @keyframes float{
    0%{ transform:translateY(100vh) scale(0); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.6; }
    100%{ transform:translateY(-10vh) scale(1); opacity:0; }
  }

  /* 鼠标跟随聚光灯效果（和MTOI原页一致） */
  .spotlight{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(
      circle 350px at var(--mouse-x, 50%) var(--mouse-y, 50%),
      rgba(95, 159, 214, 0.06),
      transparent 70%
    );
    transition: background 0.15s ease;
  }

  /* 响应式 */
  @media (max-width:520px){
    .container{ padding:32px 20px; gap:20px; }
    .mtoi-hex-wrap{ width:120px; height:120px; }
    .hex-inner{ width:108px; height:108px; }
    .hex-logo-text{ font-size:34px; -webkit-text-stroke: 1.5px var(--blue); }
    .teleport-ring{ width:170px; height:170px; margin:-85px 0 0 -85px; }
    .teleport-ring.r2{ width:200px; height:200px; margin:-100px 0 0 -100px; }
    .msg-mid{ font-size:17px; }
    .skill-tag{ font-size:15px; }
    .go-btn{ font-size:20px; padding:14px 32px; }
    .note-small{ font-size:12px; }
  }
</style>
</head>
<body>

<!-- 鼠标聚光灯 -->
<div class="spotlight" id="spotlight"></div>

<!-- 粒子背景 -->
<div class="particles" id="particles"></div>

<div class="container">
  <!-- MTOI 六边形Logo + 传送光环 -->
  <div style="position:relative;">
    <div class="teleport-ring"></div>
    <div class="teleport-ring r2"></div>
    <div class="mtoi-hex-wrap">
      <div class="hex-outer"></div>
      <div class="hex-inner">
        <span class="hex-logo-text">MTOI</span>
      </div>
    </div>
  </div>

  <!-- 文字 -->
  <div class="text-area">
    <div class="msg-mid">
      这个MTOI介绍页跑路了……其实也就换了个<span class="skill-tag">网址</span>
    </div>
    <a href="https://friend-me.github.io/crafted/MTOIintro.html" target="_self" class="go-btn" id="jumpBtn">
      点击跳转
      <span class="arrow">→</span>
    </a>
    <div class="note-small">
      本页面为域名衔接过渡页，预计 <b>2025 年 12 月 31 日</b> 下线，也可能继续保留
    </div>
  </div>
</div>

<script>
  // 生成飘浮粒子
  const container = document.getElementById('particles');
  const colors = ['c1','c2','c3'];
  for(let i=0;i<50;i++){
    const p = document.createElement('div');
    p.className = 'particle ' + colors[Math.floor(Math.random()*3)];
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = (6 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.width = p.style.height = (2 + Math.random()*3) + 'px';
    container.appendChild(p);
  }

  // 鼠标跟随聚光灯效果
  const spotlight = document.getElementById('spotlight');
  document.addEventListener('mousemove', (e) => {
    spotlight.style.setProperty('--mouse-x', e.clientX + 'px');
    spotlight.style.setProperty('--mouse-y', e.clientY + 'px');
  });

  // 跳转地址（可根据实际新地址修改，这里暂时保留原地址示例，用户可自行替换href）
  // 如需修改新网址，直接修改上方a标签的href属性即可
</script>

</body>
</html>
