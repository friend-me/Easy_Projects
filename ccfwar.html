<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大战CCF · 迁移通知</title>
<style>
  :root{
    --bg:#05060a;
    --bg-card:rgba(10,14,22,.85);
    --text:#ffffff;
    --text-dim:#94a3b8;
    --text-mid:#cbd5e1;
    --border:rgba(0,240,255,.12);
    --border-strong:rgba(0,240,255,.25);
    --cyan:#00f0ff;
    --crimson:#ff0066;
    --gold:#fbbf24;
    --green:#34d399;
    --purple:#a78bfa;
    --neon:#00ffaa;
    --grid-cyan:rgba(0,240,255,.025);
    --grid-crimson:rgba(255,0,102,.08);
    --scan:rgba(0,0,0,.18);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  body{
    min-height:100vh;
    background-color:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 赛博网格 + 光晕背景 */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 45% 35% at 20% 20%, rgba(0,240,255,.15), transparent 60%),
      radial-gradient(ellipse 45% 35% at 80% 80%, rgba(255,0,102,.15), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(167,139,250,.08), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% -10%, rgba(0,240,255,.08), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 110%, var(--grid-crimson), transparent 70%),
      linear-gradient(var(--grid-cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-cyan) 1px, transparent 1px);
    background-size:auto,auto,auto,auto,auto,48px 48px,48px 48px;
    animation: bgGlow 8s ease-in-out infinite alternate;
  }
  @keyframes bgGlow{
    0%{ opacity:.8; }
    100%{ opacity:1; }
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scan) 2px, var(--scan) 4px);
    opacity:.35;
  }

  /* ========== 主容器 ========== */
  .container{
    position:relative; z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:48px 32px;
    text-align:center;
    animation: fadeIn 1s ease-out;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* CCF 头像 */
  .ccf-avatar-wrap{
    position:relative;
    width:160px; height:160px;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 0deg, var(--cyan), var(--crimson), var(--purple), var(--cyan));
    box-shadow:
      0 0 32px rgba(0,240,255,.5),
      0 0 64px rgba(255,0,102,.3),
      0 0 96px rgba(167,139,250,.2),
      inset 0 0 20px rgba(0,240,255,.3);
    animation: avatarPulse 4s ease-in-out infinite alternate, avatarRotate 12s linear infinite;
  }
  @keyframes avatarPulse{
    0%{ box-shadow: 0 0 32px rgba(0,240,255,.5), 0 0 64px rgba(255,0,102,.3), 0 0 96px rgba(167,139,250,.2), inset 0 0 20px rgba(0,240,255,.3); }
    100%{ box-shadow: 0 0 48px rgba(0,240,255,.7), 0 0 80px rgba(255,0,102,.45), 0 0 120px rgba(167,139,250,.3), inset 0 0 28px rgba(0,240,255,.5); }
  }
  @keyframes avatarRotate{
    from{ background:conic-gradient(from 0deg, var(--cyan), var(--crimson), var(--purple), var(--cyan)); }
    to{ background:conic-gradient(from 360deg, var(--cyan), var(--crimson), var(--purple), var(--cyan)); }
  }
  .ccf-avatar-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
    background:var(--bg-card-solid);
    display:block;
    filter:contrast(1.08) brightness(1.08);
    animation: avatarInnerPulse 4s ease-in-out infinite alternate;
  }
  @keyframes avatarInnerPulse{
    0%{ filter:contrast(1.05) brightness(1.05); }
    100%{ filter:contrast(1.1) brightness(1.12) drop-shadow(0 0 12px rgba(255,0,102,.4)); }
  }

  /* 围绕头像的传送光环 */
  .teleport-ring{
    position:absolute;
    top:50%; left:50%;
    width:220px; height:220px;
    margin:-110px 0 0 -110px;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--cyan);
    border-bottom-color:var(--crimson);
    animation: spin 3s linear infinite;
    pointer-events:none;
    opacity:.6;
  }
  .teleport-ring.r2{
    width:260px; height:260px;
    margin:-130px 0 0 -130px;
    border-top-color:var(--purple);
    border-bottom-color:var(--neon);
    animation: spin 4s linear infinite reverse;
    opacity:.4;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  /* 文字区域 */
  .text-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    margin-top:20px;
  }

  .msg-mid{
    font-size:20px;
    font-weight:600;
    color:var(--text-mid);
    letter-spacing:.06em;
    text-shadow:0 0 20px rgba(0,240,255,.15);
    animation: textGlow 3s ease-in-out infinite alternate;
  }
  @keyframes textGlow{
    0%{ text-shadow:0 0 20px rgba(0,240,255,.15); }
    100%{ text-shadow:0 0 30px rgba(0,240,255,.3), 0 0 40px rgba(167,139,250,.2); }
  }

  /* 迁移技能特效文字 */
  .skill-tag{
    display:inline-block;
    padding:2px 10px;
    margin-left:4px;
    border-radius:4px;
    background:linear-gradient(90deg,rgba(167,139,250,.2),rgba(0,240,255,.2));
    border:1px solid rgba(167,139,250,.4);
    color:var(--purple);
    font-weight:700;
    font-size:18px;
    text-shadow:0 0 8px rgba(167,139,250,.5);
    animation: skillFlicker 2s ease-in-out infinite;
  }
  @keyframes skillFlicker{
    0%,100%{ opacity:1; }
    50%{ opacity:.7; }
  }

  /* 大按钮 */
  .go-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:18px 48px;
    border-radius:14px;
    border:2px solid var(--cyan);
    background:linear-gradient(180deg, rgba(0,240,255,.15), rgba(0,240,255,.03));
    color:var(--cyan);
    font-family:inherit;
    font-size:26px;
    font-weight:800;
    letter-spacing:.08em;
    text-decoration:none;
    cursor:pointer;
    transition:all .25s ease;
    box-shadow:
      0 6px 0 rgba(0,240,255,.2),
      0 0 32px rgba(0,240,255,.2),
      inset 0 0 20px rgba(0,240,255,.05);
    text-shadow:0 0 16px rgba(0,240,255,.5);
    margin-top:8px;
    overflow:hidden;
  }
  .go-btn::before{
    content:"";
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ left:-100%; }
    50%,100%{ left:100%; }
  }
  .go-btn:hover{
    transform:translateY(-4px);
    background:linear-gradient(180deg, rgba(0,240,255,.28), rgba(0,240,255,.06));
    border-color:#fff;
    color:#fff;
    box-shadow:
      0 8px 0 rgba(0,240,255,.35),
      0 0 48px rgba(0,240,255,.5),
      0 0 80px rgba(167,139,250,.3),
      inset 0 0 30px rgba(0,240,255,.1);
    text-shadow:0 0 24px rgba(0,240,255,.8), 0 0 48px rgba(167,139,250,.4);
  }
  .go-btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 rgba(0,240,255,.2), 0 0 20px rgba(0,240,255,.3);
  }
  .go-btn .arrow{
    font-size:28px;
    animation: arrowBounce 1.2s ease-in-out infinite;
  }
  @keyframes arrowBounce{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(6px); }
  }

  /* 底部小字说明 */
  .note-small{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.04em;
    opacity:.7;
    margin-top:4px;
    animation: noteFade 2s ease-out 0.5s both;
  }
  .note-small b{
    color:var(--gold);
    font-weight:600;
    text-shadow:0 0 8px rgba(251,191,36,.3);
  }
  @keyframes noteFade{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:.7; transform:translateY(0); }
  }

  /* 粒子传送效果 */
  .particles{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    opacity:.6;
    animation: float linear infinite;
  }
  .particle.c1{ background:var(--cyan); box-shadow:0 0 6px var(--cyan); }
  .particle.c2{ background:var(--crimson); box-shadow:0 0 6px var(--crimson); }
  .particle.c3{ background:var(--purple); box-shadow:0 0 6px var(--purple); }
  @keyframes float{
    0%{ transform:translateY(100vh) scale(0); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.6; }
    100%{ transform:translateY(-10vh) scale(1); opacity:0; }
  }

  /* 响应式 */
  @media (max-width:520px){
    .container{ padding:32px 20px; gap:20px; }
    .ccf-avatar-wrap{ width:120px; height:120px; }
    .teleport-ring{ width:170px; height:170px; margin:-85px 0 0 -85px; }
    .teleport-ring.r2{ width:200px; height:200px; margin:-100px 0 0 -100px; }
    .msg-mid{ font-size:17px; }
    .skill-tag{ font-size:15px; }
    .go-btn{ font-size:20px; padding:14px 32px; }
    .note-small{ font-size:12px; }
  }
</style>
</head>
<body>

<!-- 粒子背景 -->
<div class="particles" id="particles"></div>

<div class="container">
  <!-- CCF 头像 + 传送光环 -->
  <div style="position:relative;">
    <div class="teleport-ring"></div>
    <div class="teleport-ring r2"></div>
    <div class="ccf-avatar-wrap">
      <img src="https://www.oi-coding.cn/file/264/CCF_quanwei.png" alt="CCF">
    </div>
  </div>

  <!-- 文字 -->
  <div class="text-area">
    <div class="msg-mid">
      游戏跟着CCF一起使用了<span class="skill-tag">迁移技能</span>
    </div>
    <a href="https://friend-me.github.io/crafted/ccfwar.html" target="_self" class="go-btn">
      去新网址找它
      <span class="arrow">→</span>
    </a>
    <div class="note-small">
      本页面为域名衔接过渡页，预计 <b>2025 年 12 月 31 日</b> 下线，也可能继续保留～
    </div>
  </div>
</div>

<script>
  // 生成飘浮粒子
  const container = document.getElementById('particles');
  const colors = ['c1','c2','c3'];
  for(let i=0;i<40;i++){
    const p = document.createElement('div');
    p.className = 'particle ' + colors[Math.floor(Math.random()*3)];
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = (6 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.width = p.style.height = (2 + Math.random()*3) + 'px';
    container.appendChild(p);
  }
</script>
</body>
</html>
